name: Repository validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep python3-yaml

      - name: Test privacy and guardrail regressions (synthetic fixtures only)
        run: python3 -m unittest discover -s tests -v

      - name: Validate public repository boundary
        id: validation
        continue-on-error: true
        env:
          VALIDATION_QUIET: "1"
          REQUIRE_COMPOSE: "1"
        run: |
          set -o pipefail
          ./deploy/scripts/validate-repository.sh 2>&1 | tee validation-report.txt

      - name: Upload failed validation report
        if: steps.validation.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: repository-validation-report
          path: validation-report.txt
          if-no-files-found: error
          retention-days: 7

      - name: Enforce validation result
        if: steps.validation.outcome == 'failure'
        run: exit 1
