# Experimental Windows 11 / Ubuntu WSL2 / Docker Desktop override.
# Operator observed the active container has exactly /:/host:ro and no explicit
# propagation; the old temporary WSL2 Compose override no longer exists.
# Opt-in only. Preserve the Raspberry Pi / native Linux base Compose unchanged.
services:
  node-exporter:
    # Docker Desktop WSL2 currently uses a readonly root bind with default
    # rprivate propagation. This overrides native Linux's :ro,rslave bind.
    volumes:
      - /:/host:ro
    command:
      - --path.rootfs=/host
      # Keep baseline host exclusions. Exclude only Docker Desktop's internal
      # WSL bind-mount tree, where duplicate tmpfs filesystem series were
      # observed. ($$ is Compose's escape for a literal regex end anchor.)
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+|(.*/)?wsl/docker-desktop-bind-mounts)($$|/)
